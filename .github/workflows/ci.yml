name: CI
on:
    push:
    pull_request:
permissions:
    contents: read
jobs:
    verify:
        runs-on: ubuntu-latest
        services:
            postgres:
                image: postgres:17-alpine
                env:
                    POSTGRES_DB: nest_auth_starter_test
                    POSTGRES_USER: nest_test
                    POSTGRES_PASSWORD: nest_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U nest_test -d nest_auth_starter_test"
                    --health-interval 5s --health-timeout 5s --health-retries 10
        env:
            DATABASE_URL: postgresql://nest_test:nest_test@127.0.0.1:5432/nest_auth_starter_test
            TEST_DATABASE_URL: postgresql://nest_test:nest_test@127.0.0.1:5432/nest_auth_starter_test
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v7
              with:
                  node-version: '22'
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm run check
            - run: pnpm run test:all
            - run: pnpm audit --prod --audit-level=high
            - run: docker build --target production -t nest-auth-starter:ci .
