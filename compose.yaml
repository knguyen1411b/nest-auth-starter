name: nest-auth-starter
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nest_auth_starter
      POSTGRES_USER: nest_auth_starter
      POSTGRES_PASSWORD: nest_auth_starter
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nest_auth_starter -d nest_auth_starter']
      interval: 2s
      timeout: 5s
      retries: 30
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'
volumes:
  postgres-data:
