services:
    postgres-test:
        image: postgres:17-alpine
        environment:
            POSTGRES_DB: nest_auth_starter_test
            POSTGRES_USER: nest_test
            POSTGRES_PASSWORD: nest_test
        ports:
            - '127.0.0.1:${TEST_POSTGRES_PORT:-54329}:5432'
        tmpfs:
            - /var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U nest_test -d nest_auth_starter_test']
            interval: 1s
            timeout: 5s
            retries: 30
